[project]
name = "alarm-investigation-copilot"
version = "1.0.0"
description = "Alarm Investigation and Procedure Guidance Copilot: MCP server + MCP client + document RAG + GUI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.3,<3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "numpy>=1.26",
  "jsonschema>=4.22",
  "pyyaml>=6.0",
  "pypdf>=4.0",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pip-audit>=2.7",
]
diagram = ["matplotlib>=3.8"]

[tool.uv]
package = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib -ra"
testpaths = ["tests", "rag/tests"]
pythonpath = [
  ".",
  "libs",
  "apps/simulator",
  "connectors",
  "mcp-servers/alarm-management",
  "mcp-servers/work-orders",
  "apps/backend",
]
markers = [
  "e2e: end-to-end tests that start real HTTP services on local ports",
]
filterwarnings = ["ignore::DeprecationWarning"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = [
  "libs/platform_common",
  "apps/simulator/alarm_simulator",
  "connectors/alarm_connector",
  "mcp-servers/alarm-management/alarm_mcp",
  "mcp-servers/work-orders/work_orders_mcp",
  "rag/ingestion",
  "rag/retrieval",
  "apps/backend/copilot",
]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "C4", "SIM"]
ignore = [
  "S101",   # assert is fine in tests
  "S311",   # random is used for synthetic data, not crypto
  "RUF001", "RUF002", "RUF003",
  "B008",   # FastAPI Depends pattern
  "E501",   # line length is enforced by `ruff format`; long literals (regexes, prompts) are allowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S108"]
"rag/tests/**" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = [
  "platform_common", "alarm_simulator", "alarm_connector", "alarm_mcp",
  "work_orders_mcp", "rag", "copilot",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
mypy_path = "libs:apps/simulator:connectors:mcp-servers/alarm-management:mcp-servers/work-orders:apps/backend:."
explicit_package_bases = true
namespace_packages = true
exclude = ["tests/", "rag/tests/", ".venv/", "scripts/"]
