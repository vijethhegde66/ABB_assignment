name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: libs:apps/simulator:connectors:mcp-servers/alarm-management:mcp-servers/work-orders:apps/backend:.

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Static analysis (mypy)
        run: make typecheck PY=python
      - name: Dependency audit
        run: pip-audit -r requirements.txt || true   # report-only: do not block on upstream advisories
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  tests:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt && python -m playwright install --with-deps chromium
      - name: Unit tests
        run: pytest tests/unit -q
      - name: MCP tests
        run: pytest tests/integration/test_mcp_server.py tests/integration/test_mcp_client.py tests/integration/test_work_orders_mcp.py -q
      - name: RAG tests
        run: pytest rag/tests -q
      - name: Integration + contract (Postman replay) + orchestration
        run: pytest tests/integration -q
      - name: End-to-end (real HTTP + GUI)
        run: pytest tests/e2e -q
      - name: Full suite with coverage
        run: pytest --cov --cov-report=xml:coverage.xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml }

  build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Smoke test the stack
        run: |
          docker compose up -d
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/api/health && break; sleep 2; done
          curl -fsS -X POST http://localhost:8080/api/chat -H 'content-type: application/json' \
            -d '{"message":"Investigate recurring high-severity alarms for Boiler Feed Pump 101 over the last 90 days"}' \
            | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['citations'] and r['tool_trace'], r"
          curl -fsS http://localhost:3000/ > /dev/null
      - if: always()
        run: docker compose logs --no-color | tail -200 && docker compose down -v
